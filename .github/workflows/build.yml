name: Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Download and prepare blocklists
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets

          curl -fsSL --retry 3 https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts -o list1.txt
          curl -fsSL --retry 3 https://raw.githubusercontent.com/jerryn70/GoodbyeAds/master/Hosts/GoodbyeAds.txt -o list2.txt

          # Оставляем только домены: по одному на строку, без дубликатов
          cat list1.txt list2.txt \
            | tr -d '\r' \
            | sed 's/#.*//' \
            | awk '($1=="0.0.0.0" || $1=="127.0.0.1") && NF>=2 { print tolower($2) }' \
            | grep -E '^[a-z0-9_-]+(\.[a-z0-9_-]+)+$' \
            | grep -vE '^[0-9.]+$' \
            | sort -u > app/src/main/assets/hosts.txt

          rm list1.txt list2.txt
          COUNT=$(wc -l < app/src/main/assets/hosts.txt)
          echo "Доменов в списке: $COUNT"
          test "$COUNT" -gt 10000

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyDnsFilter-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
