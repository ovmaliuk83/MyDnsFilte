name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Download Ad Blocklists
        run: |
          mkdir -p app/src/main/assets
          echo "Скачиваем список 1 (StevenBlack)..."
          curl -fsSL https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts -o list1.txt --retry 3
          
          echo "Скачиваем список 2 (GoodbyeAds)..."
          curl -fsSL https://raw.githubusercontent.com/jerryn70/GoodbyeAds/master/Hosts/GoodbyeAds.txt -o list2.txt --retry 3
          
          echo "Объединяем списки..."
          # Склеиваем файлы в один и удаляем временные
          cat list1.txt list2.txt > app/src/main/assets/hosts.txt
          rm list1.txt list2.txt
      - name: Configure Gradle Mirror
        run: |
          echo "org.gradle.jvmargs=-Xmx2048m" >> gradle.properties
          echo "systemProp.org.gradle.internal.repository.max.tentatives=1" >> gradle.properties
          echo "org.gradle.internal.repository.max.tentatives=1" >> gradle.properties

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyDnsFilter-APK
          path: app/build/outputs/apk/debug/app-debug.apk
